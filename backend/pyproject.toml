[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "T20", "SIM"]
ignore = ["B008", "UP042"]  # FastAPI Depends() defaults; str+Enum kept for SQLAlchemy/Pydantic clarity

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["app"]
