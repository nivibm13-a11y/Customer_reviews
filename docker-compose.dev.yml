# Development: Postgres + backend with hot reload in Docker.
# Run the frontend natively:  cd frontend && npm run dev   (http://localhost:5174)
# Usage: docker compose -f docker-compose.dev.yml up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: reviewlens
      POSTGRES_PASSWORD: reviewlens
      POSTGRES_DB: reviewlens
    ports:
      - "5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reviewlens -d reviewlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql://reviewlens:reviewlens@db:5432/reviewlens
      FRONTEND_URL: http://localhost:5174
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata_dev:
